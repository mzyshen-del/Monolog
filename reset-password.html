<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Monolog | 重置管理员密码</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top"><a class="brand" href="index.html">Monolog</a></div>
      <nav class="side-nav"><a href="diary.html">返回日记</a></nav>
    </aside>
    <main class="content">
      <section class="panel">
        <div class="panel-head"><p class="tag">Account recovery</p><h1>重置管理员密码</h1></div>
        <form id="recovery-request-form" class="guest-form hidden">
          <p>重置链接将发送到博客管理员邮箱。请在收件箱中打开最新邮件。</p>
          <button class="btn primary" type="submit">发送重置邮件</button>
        </form>
        <form id="recovery-update-form" class="guest-form hidden">
          <label for="new-password">新密码</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required />
          <label for="confirm-password">确认新密码</label>
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required />
          <button class="btn primary" type="submit">设置新密码</button>
        </form>
        <p class="hint" id="recovery-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
